name: ITU to CSV, Oui Oui

on:
  schedule:
    # Runs on the 1st and 15th of every month at 06:00 UTC (matching ITU Operational Bulletin releases)
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/itu.py'
      - 'requirements.txt'
      - '.github/workflows/itu.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape ITU codes and update CSV
        run: |
          python scripts/itu.py --output pre/codes.csv

      - name: Commit and push changes
        run: |
          git config user.name "CooperDAndilly"
          git config user.email "151992386+CooperDAndilly@users.noreply.github.com"
          git add pre/codes.csv
          if git diff --staged --quiet; then
            echo "No changes detected in ITU numbering codes."
          else
            git commit -m "update ITU country codes"
            git push
          fi
